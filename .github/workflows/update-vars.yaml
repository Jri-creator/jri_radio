name: Update Repository Variables and Song Data

on:
  push:
    branches:
      - host

permissions:
  actions: write
  contents: write  # Added write permission for creating files

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for accurate commit dates

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq

      - name: Build variables
        id: build_vars
        run: |
          # Find and count .jlres3 files
          echo "🔍 Finding .jlres3 files..."
          mapfile -t FILES < <(find . -type f -name '*.jlres3')
          FILE_COUNT=${#FILES[@]}
          echo "📊 FILE_COUNT: $FILE_COUNT"

          # Build JSON mapping for file names
          echo "🛠️ Building file name mapping..."
          echo "{" > file_names.json
          for f in "${FILES[@]}"; do
            original=$(basename "$f")
            temp="${f}.mp3"
            cp "$f" "$temp"
            
            # Extract song name with error handling
            SONG_NAME=$(ffprobe -v error -show_entries format_tags=title \
                      -of default=noprint_wrappers=1:nokey=1 "$temp" 2>/dev/null | head -n 1 || echo "")
            rm -f "$temp"
            
            # Fallback to original name if extraction fails
            if [ -z "$SONG_NAME" ]; then
              SONG_NAME="${original%.jlres3}"
              echo "⚠️  Using fallback name for $original"
            fi
            
            # Clean and escape song name
            safe_song_name=$(echo "$SONG_NAME" | jq -R .)
            echo "  \"${original}\": ${safe_song_name}," >> file_names.json
          done
          
          # Finalize JSON file
          sed -i '$ s/,$//' file_names.json
          echo "}" >> file_names.json
          
          # Create compact version
          jq -c . file_names.json > file_names_compact.json
          
          # Get latest commit date
          PUBLISH_DATE=$(git log -1 --format='%cI')
          echo "📅 PUBLISH_DATE: $PUBLISH_DATE"

          # Set outputs
          echo "file_count=$FILE_COUNT" >> $GITHUB_OUTPUT
          echo "publish_date=$PUBLISH_DATE" >> $GITHUB_OUTPUT

      - name: Validate JSON
        run: |
          echo "✅ Validating JSON..."
          jq empty file_names_compact.json
          echo "📦 FILE_NAMES size: $(wc -c < file_names_compact.json) bytes"

      - name: Create songdec.json file
        run: |
          # Create JSON directory if it doesn't exist
          mkdir -p JSON
          
          # Copy compact JSON to songdec.json
          cp file_names_compact.json JSON/songdec.json
          
          # Add to git to commit later
          git add JSON/songdec.json
          
          echo "📁 Created JSON/songdec.json"

      - name: Commit songdec.json
        run: |
          # Configure git identity
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Commit only if there are changes
          if git diff-index --quiet HEAD --; then
            echo "🔄 No changes to commit"
          else
            git commit -m "Update songdec.json [skip ci]"
            echo "✅ Committed songdec.json"
          fi

      - name: Push songdec.json
        run: |
          # Only push if there's a commit
          if git log -1 --pretty=%B | grep -q "Update songdec.json"; then
            git push origin HEAD:host
            echo "🚀 Pushed songdec.json to repository"
          else
            echo "⏩ No commit to push"
          fi

      - name: Update repository variables
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PAT }}
        run: |
          # Read values
          FILE_COUNT_VAL="${{ steps.build_vars.outputs.file_count }}"
          PUBLISH_DATE_VAL="${{ steps.build_vars.outputs.publish_date }}"
          FILE_NAMES_VAL=$(cat file_names_compact.json)
          
          # Update function using PATCH method
          update_var() {
            echo "🔄 Updating $1..."
            gh api \
              --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/actions/variables/$1" \
              -f name="$1" \
              -f value="$2"
            echo "✅ $1 updated successfully!"
          }

          # Update variables
          update_var "FILE_COUNT" "$FILE_COUNT_VAL"
          update_var "FILE_NAMES" "$FILE_NAMES_VAL"
          update_var "PUBLISH_DATE" "$PUBLISH_DATE_VAL"
          
          echo "🎉 All variables updated successfully! 🎉"
